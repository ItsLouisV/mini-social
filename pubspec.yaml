name: viora
description: "Viora — Ứng dụng mạng xã hội mini Flutter + Supabase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Backend
  supabase_flutter: ^2.5.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.3.0

  # Analytics & Monitoring
  sentry_flutter: ^8.13.0

  # Utilities
  timeago: ^3.6.1
  uuid: ^4.4.0
  crypto: ^3.0.6
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.3
  web: ^1.0.0
  http: ^1.2.1

  # UI
  infinite_scroll_pagination: ^4.0.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  photo_view: ^0.15.0
  video_player: ^2.11.1
  async: ^2.13.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  google_mlkit_barcode_scanning: ^0.15.0

  # Audio
  audioplayers: ^6.1.0
  record: ^6.0.0
  livekit_client: ^2.7.0
  permission_handler: ^12.0.1
  font_awesome_flutter: ^11.0.0
  flutter_slidable: ^4.0.3
  flutter_secure_storage: ^10.3.0


  scrollable_positioned_list: ^0.3.8

  # Offline Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_cache_manager: ^3.3.2
  connectivity_plus: ^7.0.0
  custom_pop_up_menu: ^1.2.4
  google_fonts: ^8.1.0
  simple_media_picker: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.development
    - .env.staging
    - .env.production
    - assets/images/
    - assets/images/wallpapers/
    - assets/icons/
    - assets/sounds/

  # fonts: (download Inter from https://fonts.google.com and place in assets/fonts/)
  # - family: Inter
  #   fonts:
  #     - asset: assets/fonts/Inter-Regular.ttf
  #       weight: 400
  #     - asset: assets/fonts/Inter-Medium.ttf
  #       weight: 500
  #     - asset: assets/fonts/Inter-SemiBold.ttf
  #       weight: 600
  #     - asset: assets/fonts/Inter-Bold.ttf
  #       weight: 700
