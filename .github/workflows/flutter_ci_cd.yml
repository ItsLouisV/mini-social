name: Flutter CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true
      build_web:
        description: 'Build Flutter Web Artifact (Tải về máy)'
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # GIAI ĐOẠN 1: KIỂM TRA CHUNG (Quality Gate & Validation)
  # Kiểm tra cú pháp, static analysis và unit tests trước khi build
  # ============================================================
  validate:
    name: 🔍 Validate & Test (Chung)
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Initialize Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            cp .env.example .env.development
            cp .env.example .env.staging
            cp .env.example .env.production
          else
            echo "SUPABASE_URL=https://dummy-url.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=dummy-key" >> .env
            echo "LIVEKIT_URL=wss://dummy-url.livekit.cloud" >> .env
            cp .env .env.development
            cp .env .env.staging
            cp .env .env.production
          fi

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠️ Generate Riverpod Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔎 Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Unit Tests
        run: flutter test

  # ============================================================
  # GIAI ĐOẠN 2 - LUỒNG 1: BIÊN DỊCH ANDROID APK (Chạy song song)
  # Tự động build APK mỗi khi push vào main/master hoặc dispatch
  # ============================================================
  build-android:
    name: 🤖 Build Android APK
    needs: [validate]
    if: success() && (github.event_name != 'workflow_dispatch' || inputs.build_android == true)
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Initialize Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            cp .env.example .env.development
            cp .env.example .env.staging
            cp .env.example .env.production
          else
            echo "SUPABASE_URL=https://dummy-url.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=dummy-key" >> .env
            echo "LIVEKIT_URL=wss://dummy-url.livekit.cloud" >> .env
            cp .env .env.development
            cp .env .env.staging
            cp .env .env.production
          fi

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠️ Generate Riverpod Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 Build Android APK Release
        run: flutter build apk --release

      - name: 📤 Upload Android APK Artifact (Lưu 3 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 3

  # ============================================================
  # GIAI ĐOẠN 2 - LUỒNG 2: BIÊN DỊCH FLUTTER WEB
  # Lưu ý kiến trúc: Vercel đã kết nối trực tiếp với GitHub repo này
  # và tự động build & hiển thị Web Live khi có push.
  # Do đó, trên GitHub Actions luồng Web chỉ chạy khi kích hoạt thủ công
  # (workflow_dispatch) để tránh bị BUILD 2 LẦN trùng lặp!
  # ============================================================
  build-web:
    name: 🌐 Build Flutter Web (Manual Export)
    needs: [validate]
    if: success() && github.event_name == 'workflow_dispatch' && inputs.build_web == true
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Initialize Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            cp .env.example .env.development
            cp .env.example .env.staging
            cp .env.example .env.production
          else
            echo "SUPABASE_URL=https://dummy-url.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=dummy-key" >> .env
            echo "LIVEKIT_URL=wss://dummy-url.livekit.cloud" >> .env
            cp .env .env.development
            cp .env .env.staging
            cp .env .env.production
          fi

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠️ Generate Riverpod Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🌐 Build Flutter Web Release
        run: flutter build web --release

      - name: 📤 Upload Web Build Artifact (Lưu 3 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: web-release-build
          path: build/web/
          retention-days: 3
